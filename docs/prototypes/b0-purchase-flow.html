<title>Bunker Desk Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&display=swap">
<style>
/* Layout: workspace — sticky header with role switcher, left nav, one working pane; tables carry the data */
:root {
  --bg: #f3f5f7; --surface: #ffffff; --fg: #17212b; --muted: #5b6876; --line: #d7dde3;
  --accent: #c2410c; --accent-fg: #ffffff; --accent-soft: #fbe6da;
  --ok: #1f7a4d; --ok-soft: #dcf1e6; --warn: #9a6200; --warn-soft: #fbefd2; --crit: #b42318; --crit-soft: #fde4e2;
  --info-soft: #e3ecf5; --banner: #17212b; --banner-fg: #f3f5f7;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", "IBM Plex Sans", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", monospace;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f151b; --surface: #17202a; --fg: #e4e9ee; --muted: #9aa7b4; --line: #2b3742;
  --accent: #f0814a; --accent-fg: #1a0d05; --accent-soft: #3a2116;
  --ok: #5cc795; --ok-soft: #133426; --warn: #e8b04b; --warn-soft: #3a2c10; --crit: #f2867c; --crit-soft: #3d1715;
  --info-soft: #1c2a38; --banner: #e4e9ee; --banner-fg: #0f151b; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f151b; --surface: #17202a; --fg: #e4e9ee; --muted: #9aa7b4; --line: #2b3742;
  --accent: #f0814a; --accent-fg: #1a0d05; --accent-soft: #3a2116;
  --ok: #5cc795; --ok-soft: #133426; --warn: #e8b04b; --warn-soft: #3a2c10; --crit: #f2867c; --crit-soft: #3d1715;
  --info-soft: #1c2a38; --banner: #e4e9ee; --banner-fg: #0f151b; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--banner); }
.banner { background: var(--banner); color: var(--banner-fg); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; padding-block: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; gap: var(--s3); align-items: center; justify-content: space-between; padding-block: var(--s3);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { font-family: var(--font-display); font-size: 18px; letter-spacing: .02em; }
.brand small { font-family: var(--font-body); font-weight: 400; color: var(--muted); font-size: 12px; margin-left: var(--s2); }
.roles { display: flex; gap: var(--s1); flex-wrap: wrap; align-items: center; }
.roles span { color: var(--muted); font-size: 12px; margin-right: var(--s1); }
.shell { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: var(--s5); padding-block: var(--s5);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1320px; margin: 0 auto; }
nav.side { display: flex; flex-direction: column; gap: var(--s1); }
nav.side a, nav.side span { padding: var(--s2) var(--s3); border-radius: var(--radius); color: var(--fg); text-decoration: none; }
nav.side a[aria-current="page"] { background: var(--info-soft); font-weight: 600; }
nav.side span { color: var(--muted); font-size: 13px; }
nav.side .group { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: var(--s3) var(--s3) var(--s1); }
main { min-width: 0; display: flex; flex-direction: column; gap: var(--s5); }
h1 { font-family: var(--font-display); font-size: 24px; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h2 { font-size: 15px; margin: 0; font-weight: 600; }
.sub { color: var(--muted); margin: var(--s1) 0 0; }
.pagehead { display: flex; flex-wrap: wrap; gap: var(--s3); justify-content: space-between; align-items: flex-end; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.panel > .ph { display: flex; justify-content: space-between; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); }
.panel > .pb { padding: var(--s4); display: flex; flex-direction: column; gap: var(--s4); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--s3) var(--s4); }
label.f { display: flex; flex-direction: column; gap: var(--s1); font-size: 12px; color: var(--muted); min-width: 0; }
input, select, textarea { font: inherit; font-size: 14px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; width: 100%; }
textarea { min-height: 64px; resize: vertical; }
input.num { font-family: var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }
button, .btn { font: inherit; font-size: 13px; font-weight: 500; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 4px; padding: 6px 12px; cursor: pointer; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
button.primary, .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button.ghost { border-color: transparent; }
button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
button:disabled { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.actions { display: flex; flex-wrap: wrap; gap: var(--s2); justify-content: flex-end; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: var(--s2) var(--s3); border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 500; white-space: nowrap; }
td.n, th.n { text-align: right; font-family: var(--font-mono); }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--info-soft); }
tr.sel td { background: var(--info-soft); }
tr.best td:first-child { box-shadow: inset 3px 0 0 var(--ok); }
.mono { font-family: var(--font-mono); }
td.mono, td.n { white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--info-soft); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.crit { background: var(--crit-soft); color: var(--crit); } .pill.acc { background: var(--accent-soft); color: var(--accent); }
.muted { color: var(--muted); }
.note { font-size: 12px; color: var(--muted); }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: var(--s4); align-items: start; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--s1) var(--s4); margin: 0; }
.kv dt { color: var(--muted); font-size: 12px; } .kv dd { margin: 0; }
.draft { font-family: var(--font-mono); font-size: 12.5px; white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: var(--s3); margin: 0; overflow-x: auto; }
.locked { display: flex; gap: var(--s2); align-items: center; padding: var(--s3) var(--s4); background: var(--info-soft); border-radius: var(--radius); color: var(--muted); }
.steps { display: flex; flex-wrap: wrap; gap: var(--s1); font-size: 12px; }
.steps span { padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.steps span.done { color: var(--ok); border-color: var(--ok); } .steps span.now { color: var(--accent-fg); background: var(--accent); border-color: var(--accent); }
.calc { font-family: var(--font-mono); font-size: 12px; line-height: 1.6; }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: var(--s2) var(--s4); border-radius: var(--radius); font-size: 13px; }
@media (max-width: 900px) { .shell { grid-template-columns: minmax(0, 1fr); } nav.side { flex-direction: row; flex-wrap: wrap; } nav.side .group { display: none; } .split { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: no-preference) { tr.clickable td { transition: background .12s; } }
</style>

<div class="banner" role="note">Prototype — demo data only · no real companies, prices or contacts · nothing is saved or sent</div>
<header class="top">
  <div class="brand">Bunker Desk <small>Pilot 1 concept</small></div>
  <div class="roles" role="group" aria-label="View as role">
    <span>View as</span>
    <button type="button" data-role="buyer">Bunker Buyer</button>
    <button type="button" data-role="operator">Operator</button>
    <button type="button" data-role="viewer">Viewer</button>
    <button type="button" data-role="admin">Admin</button>
  </div>
</header>
<div class="shell">
  <nav class="side" aria-label="Main">
    <div class="group">Purchase</div>
    <a href="#worklist" data-nav="worklist">Work list</a>
    <a href="#inquiry" data-nav="inquiry">Inquiry</a>
    <a href="#suppliers" data-nav="suppliers">Suppliers</a>
    <a href="#rfq" data-nav="rfq">RFQ drafts</a>
    <a href="#offers" data-nav="offers">Offers</a>
    <a href="#compare" data-nav="compare">Compare &amp; decide</a>
    <a href="#nomination" data-nav="nomination">Nomination</a>
    <div class="group">Pilot 2</div>
    <span aria-disabled="true">Delivery</span><span aria-disabled="true">Invoices</span><span aria-disabled="true">Claims</span><span aria-disabled="true">Reports</span>
    <div class="group">Review</div>
    <a href="#notes" data-nav="notes">Reviewer notes</a>
  </nav>
  <main id="view" tabindex="-1"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
// ---------- exact money (BigInt): qty in thousandths of mt, price in cents/mt ----------
const toMilli = s => { const [i, f = ""] = String(s).trim().split("."); return BigInt(i || "0") * 1000n + BigInt((f + "000").slice(0, 3)); };
const toCents = s => { const [i, f = ""] = String(s).trim().split("."); return BigInt(i || "0") * 100n + BigInt((f + "00").slice(0, 2)); };
const lineCents = (qty, price) => { const p = toMilli(qty) * toCents(price); return (p + 500n) / 1000n; }; // half-up to cents
const fmtUsd = c => { const neg = c < 0n; c = neg ? -c : c; const s = (c / 100n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " "); return (neg ? "-" : "") + s + "." + (c % 100n).toString().padStart(2, "0"); };
const fmtQty = q => Number(q).toLocaleString("en-GB", { maximumFractionDigits: 3 }).replace(/,/g, " ");
const esc = v => String(v ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));

// ---------- demo master data (invented, anonymized per D-066) ----------
const VESSELS = {
  "MT Nordic Example": { imo: "9074729", type: "Product tanker", dwt: "49 900", flag: "Example Islands", entity: "Example Bulk Tankers AB" },
  "MT Aurora Demo": { imo: "9183520", type: "Chemical tanker", dwt: "25 400", flag: "Example Islands", entity: "Example Bulk Tankers AB" },
  "MV Baltic Sample": { imo: "9241061", type: "Bulk carrier", dwt: "63 500", flag: "Sampleland", entity: "Example Dry Ltd" },
};
const PORTS = ["Rotterdam", "Gibraltar", "Singapore", "Houston"];
const PRODUCTS = ["HSFO 3.5%", "VLSFO 0.5%", "DMA 0.1%", "Biofuel", "B24", "B30", "B100", "Bio diesel FAME"];
const ISO = ["ISO 8217:2005", "ISO 8217:2010", "ISO 8217:2012", "ISO 8217:2017", "ISO 8217:2024"];
const REASONS = ["Bunkers only", "Working cargo", "Debunkering"];
const SUPPLIERS = [
  { name: "Alpha Fuels", kind: "Physical supplier", contact: "Anna Example", email: "sales@alpha-fuels.example", ports: { Rotterdam: ["VLSFO 0.5%", "DMA 0.1%", "HSFO 3.5%"], Gibraltar: ["VLSFO 0.5%", "DMA 0.1%"] } },
  { name: "Beta Marine Energy", kind: "Physical supplier", contact: "Bo Sample", email: "desk@beta-marine.example", ports: { Rotterdam: ["VLSFO 0.5%", "DMA 0.1%"] } },
  { name: "Gamma Trading", kind: "Trader", contact: "Carla Demo", email: "ops@gamma-trading.example", ports: { Rotterdam: ["VLSFO 0.5%", "DMA 0.1%"], Singapore: ["VLSFO 0.5%"] } },
  { name: "Delta Oil Bunkering", kind: "Physical supplier", contact: "Dan Example", email: "rfq@delta-oil.example", ports: { Rotterdam: ["DMA 0.1%"] } },
  { name: "Epsilon Bunkers", kind: "Trader", contact: "Eva Sample", email: "trading@epsilon.example", ports: { Singapore: ["VLSFO 0.5%", "DMA 0.1%"] } },
];
const RATIONALE_REASONS = ["Flexibility", "Operational fit", "Availability", "Reliability", "Timing", "Payment terms", "Commercial judgement", "Other"];

// ---------- prototype state ----------
const S = {
  role: "buyer", selectedOffer: null, toastTimer: 0,
  inq: {
    ref: "INQ-2611-014", status: "Draft", vessel: "MT Nordic Example", voyage: "V-2611", operator: "Olle Operator", buyer: "Bea Buyer", requester: "Olle Operator",
    port: "Rotterdam", eta: "2026-11-12T06:00", etd: "2026-11-13T18:00", agent: "Harbour Agency Example", reason: "Bunkers only",
    deadline: "2026-11-07T12:00", comments: "Owners prefer delivery before cargo ops. Budget guide approx. 550 USD/mt VLSFO (internal only).",
    lines: [ { grade: "VLSFO 0.5%", qty: "1200", iso: "ISO 8217:2017", spec: "Max sulphur 0.50%" }, { grade: "DMA 0.1%", qty: "150", iso: "ISO 8217:2024", spec: "" } ],
  },
  chosen: new Set(), rfqs: [], offers: [], winner: null, rationale: { reason: "", text: "" }, nominated: false,
};
const OTHER = [
  { ref: "INQ-2611-009", vessel: "MV Baltic Sample", port: "Gibraltar", eta: "08 Nov 14:00", status: "Offers received", next: "Compare 4 of 5 offers", warn: { t: "Offer validity ends in 3 h", k: "warn" } },
  { ref: "INQ-2611-011", vessel: "MT Aurora Demo", port: "Singapore", eta: "15 Nov 09:00", status: "RFQ sent", next: "2 of 3 offers in", warn: { t: "RFQ deadline tomorrow 10:00", k: "warn" } },
  { ref: "INQ-2611-006", vessel: "MT Aurora Demo", port: "Houston", eta: "06 Nov 22:00", status: "Winner selected", next: "Create nomination", warn: { t: "ETA in 18 h, not nominated", k: "crit" } },
  { ref: "INQ-2610-118", vessel: "MV Baltic Sample", port: "Rotterdam", eta: "02 Nov 08:00", status: "Nominated", next: "Delivery (pilot 2)", warn: null },
];
const FLOW = ["Draft", "RFQ sent", "Offers received", "Winner selected", "Nominated"];
const canSeePrices = () => S.role !== "operator";
const canBuy = () => S.role === "buyer" || S.role === "admin";
const canCreate = () => S.role !== "viewer";

// ---------- offers ----------
function offerTotal(o) {
  let total = 0n; const lines = [];
  for (const l of S.inq.lines) {
    const p = o.prices[l.grade];
    if (p === "" || p == null) { lines.push({ grade: l.grade, qty: l.qty, price: null, cents: null }); continue; }
    const c = lineCents(l.qty, p); total += c; lines.push({ grade: l.grade, qty: l.qty, price: p, cents: c });
  }
  const fixed = Object.values(o.fixed).reduce((a, v) => a + (v === "" ? 0n : toCents(v)), 0n);
  return { lines, fixed, total: total + fixed, missing: lines.some(x => x.cents === null) };
}
function seedOffers() {
  if (S.offers.length) return;
  const base = [
    { supplier: "Alpha Fuels", prices: { "VLSFO 0.5%": "548.00", "DMA 0.1%": "712.00" }, fixed: { barging: "1800.00", portcall: "0.00", agent: "350.00", surveyor: "250.00", other: "0.00" }, valid: "2026-11-06T16:00", pay: "30 days net", delivery: "12 Nov 06:00–14:00 · barge", physical: "", comment: "" },
    { supplier: "Beta Marine Energy", prices: { "VLSFO 0.5%": "551.50", "DMA 0.1%": "705.00" }, fixed: { barging: "1500.00", portcall: "0.00", agent: "300.00", surveyor: "0.00", other: "0.00" }, valid: "2026-11-06T18:00", pay: "45 days net", delivery: "12 Nov 08:00–20:00 · barge", physical: "", comment: "Barge confirmed subject to berth line-up." },
    { supplier: "Gamma Trading", prices: { "VLSFO 0.5%": "549.00", "DMA 0.1%": "" }, fixed: { barging: "2600.00", portcall: "500.00", agent: "450.00", surveyor: "350.00", other: "0.00" }, valid: "2026-11-06T11:00", pay: "30 days net", delivery: "12 Nov 06:00–12:00 · barge", physical: "Alpha Fuels", comment: "VLSFO only." },
  ];
  S.offers = base.filter(o => S.chosen.has(o.supplier));
}

// ---------- rendering helpers ----------
const statusPill = s => `<span class="pill ${s === "Nominated" ? "ok" : s === "Winner selected" ? "acc" : ""}">${esc(s)}</span>`;
const steps = () => `<div class="steps" aria-label="Status flow">${FLOW.map((f, i) => { const k = FLOW.indexOf(S.inq.status); return `<span class="${i < k ? "done" : i === k ? "now" : ""}">${esc(f)}</span>`; }).join("")}</div>`;
const lock = what => `<div class="locked" role="note">Hidden for your role: ${esc(what)} (D-072)</div>`;
const fmtDt = v => { if (!v) return "—"; const d = new Date(v + ":00Z"); return d.toLocaleString("en-GB", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "UTC" }) + " UTC"; };
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(S.toastTimer); S.toastTimer = setTimeout(() => { t.hidden = true; }, 2200); }
function nextStep() {
  switch (S.inq.status) {
    case "Draft": return "Select suppliers and create RFQs";
    case "RFQ sent": return `${S.offers.length} of ${S.rfqs.length} offers in`;
    case "Offers received": return "Compare offers and select winner";
    case "Winner selected": return "Create nomination";
    default: return "Delivery (pilot 2)";
  }
}

// ---------- views ----------
const V = {};
V.worklist = () => {
  const rows = [{ ref: S.inq.ref, vessel: S.inq.vessel, port: S.inq.port, eta: fmtDt(S.inq.eta).replace(" UTC", ""), status: S.inq.status, next: nextStep(), warn: S.inq.status === "RFQ sent" ? { t: "RFQ deadline " + fmtDt(S.inq.deadline), k: "warn" } : null, live: true }, ...OTHER];
  return `<div class="pagehead"><div><h1>Work list</h1><p class="sub">${rows.filter(r => r.status !== "Nominated").length} open inquiries · times in UTC</p></div>
    <div class="actions">${canCreate() ? `<a class="btn primary" href="#inquiry">New inquiry</a>` : ""}</div></div>
    <section class="panel"><div class="tablewrap"><table>
      <thead><tr><th>Inquiry</th><th>Vessel</th><th>Port</th><th>ETA</th><th>Status</th><th>Next step</th><th>Attention</th></tr></thead>
      <tbody>${rows.map(r => `<tr class="${r.live ? "clickable" : ""}" ${r.live ? `data-go="inquiry" tabindex="0"` : ""}>
        <td class="mono">${esc(r.ref)}${r.live ? "" : ` <span class="note">(static)</span>`}</td><td>${esc(r.vessel)}</td><td>${esc(r.port)}</td><td class="mono">${esc(r.eta)}</td>
        <td>${statusPill(r.status)}</td><td>${esc(r.next)}</td><td>${r.warn ? `<span class="pill ${r.warn.k}">${esc(r.warn.t)}</span>` : `<span class="muted">—</span>`}</td></tr>`).join("")}</tbody>
    </table></div></section>
    <p class="note">Only ${esc(S.inq.ref)} is live in this prototype; the other rows show what the list looks like at ~10 open inquiries (assumption A3).</p>`;
};
V.inquiry = () => {
  const v = VESSELS[S.inq.vessel]; const ro = !canBuy() && !(S.role === "operator" && S.inq.status === "Draft");
  const dis = ro ? "disabled" : "";
  const opt = (list, cur) => list.map(x => `<option ${x === cur ? "selected" : ""}>${esc(x)}</option>`).join("");
  return `<div class="pagehead"><div><h1>${esc(S.inq.ref)}</h1><p class="sub">${esc(S.inq.vessel)} · ${esc(S.inq.port)}</p></div>${steps()}</div>
  <section class="panel"><div class="ph"><h2>Vessel &amp; voyage</h2></div><div class="pb"><div class="grid">
    <label class="f">Vessel<select id="f-vessel" data-k="vessel" ${dis}>${opt(Object.keys(VESSELS), S.inq.vessel)}</select></label>
    <label class="f">Voyage<input id="f-voyage" data-k="voyage" value="${esc(S.inq.voyage)}" ${dis}></label>
    <label class="f">Operator<input id="f-operator" data-k="operator" value="${esc(S.inq.operator)}" ${dis}></label>
    <label class="f">Buyer<input id="f-buyer" data-k="buyer" value="${esc(S.inq.buyer)}" ${dis}></label>
    <label class="f">Requester<input id="f-requester" data-k="requester" value="${esc(S.inq.requester)}" ${dis}></label>
    <label class="f">Entity<input id="f-entity" value="${esc(v.entity)}" disabled></label>

function render() {
  const name = (location.hash || "#worklist").slice(1); const view = V[name] ? name : "worklist";
  document.getElementById("view").innerHTML = V[view]();
  document.querySelectorAll("[data-nav]").forEach(a => { if (a.dataset.nav === view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  document.querySelectorAll("[data-role]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.role === S.role)));

document.addEventListener("click", e => {
  const t = e.target.closest("button, tr[data-go], tr[data-pick]"); if (!t) return;
  if (t.dataset.role) { S.role = t.dataset.role; render(); toast("Viewing as " + t.textContent); return; }
  if (t.dataset.go) { location.hash = t.dataset.go; return; }
  if (t.dataset.pick) { S.selectedOffer = t.dataset.pick; render(); return; }
  if (t.id === "add-line") { S.inq.lines.push({ grade: "DMA 0.1%", qty: "", iso: "ISO 8217:2024", spec: "" }); render(); return; }
  if (t.dataset.del) { S.inq.lines.splice(Number(t.dataset.del), 1); render(); return; }
  if (t.id === "save") { toast("Draft saved (prototype only)"); return; }
  if (t.id === "make-rfqs") { const now = new Date().toISOString().slice(11, 16) + " UTC"; S.rfqs = [...S.chosen].map(n => ({ supplier: n, generated: now, sent: "" })); S.preview = 0; location.hash = "rfq"; return; }
  if (t.dataset.preview) { S.preview = Number(t.dataset.preview); render(); document.getElementById("draft-" + S.preview)?.scrollIntoView({ block: "nearest" }); return; }
  if (t.dataset.copy) { const i = Number(t.dataset.copy); const txt = rfqText(SUPPLIERS.find(x => x.name === S.rfqs[i].supplier));
    navigator.clipboard?.writeText(txt).then(() => toast("RFQ text copied"), () => toast("Copy blocked here — select the text instead")); return; }
  if (t.dataset.sent) { const r = S.rfqs[Number(t.dataset.sent)]; r.sent = new Date().toISOString().slice(11, 16) + " UTC"; if (S.inq.status === "Draft") S.inq.status = "RFQ sent"; render(); toast("Marked as sent to " + r.supplier); return; }
  if (t.dataset.edit) { S.editOffer = Number(t.dataset.edit); render(); return; }
  if (t.id === "select-winner") { S.winner = t.dataset.s; S.inq.status = "Winner selected"; render(); toast("Winner selected: " + S.winner); return; }
  if (t.id === "nominate") { S.nominated = true; S.inq.status = "Nominated"; render(); toast("Nomination created"); return; }
  if (t.id === "reset") { location.reload(); }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("tr[data-go], tr[data-pick]")) e.target.click(); });
document.addEventListener("input", e => {
  const el = e.target; const ds = el.dataset;

  else if (ds.sup) { el.checked ? S.chosen.add(ds.sup) : S.chosen.delete(ds.sup); render(); return; }
  else if (ds.price || ds.fixed || ds.ok) { const o = S.offers[S.editOffer ?? 0];
    if (ds.price) { if (el.value !== "" && !/^\d+(\.\d{0,2})?$/.test(el.value)) return; o.prices[ds.price] = el.value; }
    else if (ds.fixed) { if (el.value !== "" && !/^\d+(\.\d{0,2})?$/.test(el.value)) return; o.fixed[ds.fixed] = el.value; }
    else o[ds.ok] = el.value;
    if (S.inq.status === "RFQ sent") S.inq.status = "Offers received";
    if (ds.price || ds.fixed) { const id = el.id, pos = el.selectionStart; render(); const n = document.getElementById(id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch {} } }
    return; }
  else if (el.id === "rat-reason") { S.rationale.reason = el.value; render(); document.getElementById("rat-reason")?.focus(); return; }
  else if (el.id === "rat-text") { S.rationale.text = el.value; const b = document.getElementById("select-winner"); if (b && S.selectedOffer && b.dataset.s !== undefined) { const notBest = !!document.getElementById("rat-reason"); b.disabled = notBest && (!S.rationale.reason || !S.rationale.text.trim()); } return; }
  if (ds.k === "vessel" || ds.k === "port" || ds.lk === "grade") { if (!S.rfqs.length) S.chosen.clear(); render(); }
});
document.addEventListener("change", e => { if (e.target.dataset.sup !== undefined) return; if (e.target.matches("select[data-k], select[data-lk]")) render(); });
// offers move status forward once any offer exists after RFQs are sent
const _offers = V.offers; V.offers = () => { const h = _offers(); if (S.inq.status === "RFQ sent" && S.offers.length) S.inq.status = "Offers received"; return h; };
render();
