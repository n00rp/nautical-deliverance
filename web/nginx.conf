server {
    listen 8080;
    root /usr/share/nginx/html;

    # Revalidate every response (a cheap 304 when unchanged), so a deploy is never hidden behind a cached index.html.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:8081; form-action 'self' http://localhost:8081; base-uri 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://engine:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
