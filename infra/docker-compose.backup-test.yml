# CI/test only (tools/test_backup_restore.sh, B6-R06): the dev stack with Keycloak on the Postgres
# `keycloak` database (as in production) plus an S3 stand-in. Test credentials only.
# S3 stand-in: SeaweedFS (Apache-2.0), pinned by digest; test credentials only (ruling R8).
services:
  db:
    environment:
      ND_DB_KEYCLOAK_PASSWORD: ci-keycloak-password

  keycloak:
    depends_on:
      db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ci-keycloak-password

  # Apache-2.0 S3 stand-in (SeaweedFS). It accepts and returns bucket lifecycle configuration,
  # which the test sets and checks with aws-cli (tools/test_backup_restore.sh).
  s3:
    image: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-master.volumeSizeLimitMB=64"]
    environment:
      AWS_ACCESS_KEY_ID: ci-s3-user
      AWS_SECRET_ACCESS_KEY: ci-s3-password
    healthcheck:
      # 403 for anonymous requests is fine: curl only fails when nothing listens.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1:8333/"]
      interval: 3s
      timeout: 3s
      retries: 30
