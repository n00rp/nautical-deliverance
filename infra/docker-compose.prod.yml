# Production overlay (B6-D7). Use together with the base file and a server-side env file:
#   docker compose --env-file infra/.env.prod -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d --build
# Every secret uses `:?`, so a missing value stops the start instead of falling back to the base
# file's dev default. Only Caddy publishes ports.
services:
  caddy:
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    restart: unless-stopped
    environment:
      ND_PUBLIC_HOST: ${ND_PUBLIC_HOST:?set ND_PUBLIC_HOST in infra/.env.prod}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  db:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${ND_DB_SUPERUSER_PASSWORD:?set in infra/.env.prod}
      ND_DB_OWNER_PASSWORD: ${ND_DB_OWNER_PASSWORD:?set in infra/.env.prod}
      ND_DB_APP_PASSWORD: ${ND_DB_APP_PASSWORD:?set in infra/.env.prod}
      ND_DB_KEYCLOAK_PASSWORD: ${ND_DB_KEYCLOAK_PASSWORD:?set in infra/.env.prod}
    ports: !reset []

  keycloak:
    restart: unless-stopped
    command: ["start", "--import-realm"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      ND_PUBLIC_HOST: ${ND_PUBLIC_HOST:?set ND_PUBLIC_HOST in infra/.env.prod}
      KC_HOSTNAME: https://${ND_PUBLIC_HOST:?set ND_PUBLIC_HOST in infra/.env.prod}
      # Admin console and master realm are built on the loopback/tunnel URL, not the public host
      # (Caddy returns 404 for /admin and /realms/master). The base file's loopback-only port
      # 127.0.0.1:8081:8080 is kept as the tunnel target (ssh -L 8081:127.0.0.1:8081 <server>).
      KC_HOSTNAME_ADMIN: http://localhost:8081
      KC_PROXY_HEADERS: xforwarded
      # Plain HTTP only on the internal compose network; Caddy terminates TLS.
      KC_HTTP_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${ND_DB_KEYCLOAK_PASSWORD:?set in infra/.env.prod}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${ND_KEYCLOAK_ADMIN_PASSWORD:?set in infra/.env.prod}
    volumes: !override
      - ./keycloak/realm-pilot.json:/opt/keycloak/data/import/realm-pilot.json:ro

  engine:
    restart: unless-stopped
    environment:
      ND_DATABASE_URL: postgresql+psycopg://nd_app:${ND_DB_APP_PASSWORD:?set in infra/.env.prod}@db:5432/nd
      ND_MIGRATION_DATABASE_URL: postgresql+psycopg://nd_owner:${ND_DB_OWNER_PASSWORD:?set in infra/.env.prod}@db:5432/nd
      ND_SEED: pilot
      # Tokens carry the public issuer; the JWKS is fetched over the internal network.
      ND_OIDC_ISSUER: https://${ND_PUBLIC_HOST:?set ND_PUBLIC_HOST in infra/.env.prod}/realms/nautical-deliverance
    ports: !reset []

  web:
    restart: unless-stopped
    build:
      args:
        VITE_OIDC_AUTHORITY: https://${ND_PUBLIC_HOST:?set ND_PUBLIC_HOST in infra/.env.prod}/realms/nautical-deliverance
    ports: !reset []

  # Nightly encrypted backup (B6-R06): supercronic runs backup.sh at 02:15 UTC (infra/backup/crontab).
  # The container restarts with the Docker daemon after a reboot (enable docker.service), so the
  # timer survives.
  backup:
    image: nautical-deliverance/backup:${ND_IMAGE_TAG:-dev}
    build:
      context: ./backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # A superuser: pg_dump as nd_app would see no rows (RLS). The password stays in this container only.
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${ND_DB_SUPERUSER_PASSWORD:?set in infra/.env.prod}
      ND_BACKUP_BUCKET: ${ND_BACKUP_BUCKET:?set in infra/.env.prod}
      ND_BACKUP_S3_ENDPOINT: ${ND_BACKUP_S3_ENDPOINT:?set in infra/.env.prod}
      ND_BACKUP_S3_REGION: ${ND_BACKUP_S3_REGION:?set in infra/.env.prod}
      ND_BACKUP_S3_ACCESS_KEY: ${ND_BACKUP_S3_ACCESS_KEY:?set in infra/.env.prod}
      ND_BACKUP_S3_SECRET_KEY: ${ND_BACKUP_S3_SECRET_KEY:?set in infra/.env.prod}

volumes:
  caddy-data:
  caddy-config:
