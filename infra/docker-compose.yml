services:
  db:
    image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
    environment:
      POSTGRES_DB: nd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ND_DB_SUPERUSER_PASSWORD:?set in infra/.env}
      ND_DB_OWNER_PASSWORD: ${ND_DB_OWNER_PASSWORD:?set in infra/.env}
      ND_DB_APP_PASSWORD: ${ND_DB_APP_PASSWORD:?set in infra/.env}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/postgresql/data
    ports:
      # Loopback only: lets host-run tests reach the DB; never exposed to the network.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nd"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db-data:
