# req: S0-R10
version: 2
updates:
  - package-ecosystem: uv
    directory: /engine
    schedule: { interval: weekly }
    cooldown: { default-days: 14 } # project rule: only releases at least 14 days old
  - package-ecosystem: npm # also covers pnpm lockfiles
    directory: /web
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
  - package-ecosystem: docker
    directories: [/engine, /web, /infra]
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
