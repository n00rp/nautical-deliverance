# req: S0-R10
version: 2
updates:
  - package-ecosystem: uv
    directory: /engine
    schedule: { interval: weekly }
    cooldown: { default-days: 14 } # project rule: only releases at least 14 days old
    commit-message: { prefix: "chore", include: "scope" }
  - package-ecosystem: npm # also covers pnpm lockfiles
    directory: /web
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    commit-message: { prefix: "chore", include: "scope" }
  - package-ecosystem: docker
    directories: [/engine, /web]
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    commit-message: { prefix: "chore", include: "scope" }
    ignore:
      # D-030: eccodes has no cp315 wheel yet; lift once it does.
      - dependency-name: "python"
        versions: [">=3.15"]
  - package-ecosystem: docker-compose
    directory: /infra
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    commit-message: { prefix: "chore", include: "scope" }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    commit-message: { prefix: "chore", include: "scope" }
