# req: S0-R10
name: CodeQL

# D-045: code scanning is unavailable on GitHub Free private repos. Enable pull_request/push triggers when the account is upgraded.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One job (not a matrix) so the required status check is a single "CodeQL".
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: python,javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
