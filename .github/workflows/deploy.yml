# Pilot deploy (B6-D3, B6-R07). Runs only after CI finished green for a push to main, or when the
# owner dispatches a commit by hand whose push CI run on main was green. Secrets come from GitHub
# secrets only. This workflow waits for CI only, not for the heavy workflow (heavy.yml): the E2E
# runs against the pilot below after every deploy anyway.
# req: B6-R07
name: Deploy pilot

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-character commit SHA to deploy (a commit whose CI was green)"
        required: true
        type: string
      allow_rollback:
        description: "Deploy a commit older than the one running now (rollback to a known-good commit)"
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

# One deploy at a time; a running deploy is never cancelled halfway.
concurrency:
  group: deploy-pilot
  cancel-in-progress: false

jobs:
  deploy:
    # Review Focus #1: never a commit whose CI failed, and never a CI run for a pull request.
    # ND_DEPLOY_ENABLED (a repository variable) gates only the automatic path, so the owner can
    # switch it on after the first manual deploy; a dispatch always works, but only from main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (vars.ND_DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
      ND_DEPLOY_HOST: ${{ secrets.ND_DEPLOY_HOST }}
      ND_PUBLIC_HOST: ${{ secrets.ND_PUBLIC_HOST }}
      ROLLBACK_FLAG: ${{ inputs.allow_rollback && '--allow-rollback' || '' }}
    steps:
      - name: The commit is a full SHA
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "not a 40-character SHA: $SHA"; exit 1; }
      # I5: a manual deploy needs a green push CI run for that exact commit (the server also insists
      # that the commit is on main). The automatic path is already a green push CI run by its trigger.
      - name: A green push CI run exists for the commit (dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n="$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&status=success" --jq .total_count)"
          [ "$n" -ge 1 ] || { echo "no successful push CI run for $SHA: refusing to deploy it"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - name: SSH key and pinned host key
        env:
          SSH_KEY: ${{ secrets.ND_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ND_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host pilot\n  HostName %s\n  User deploy\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking=yes\n' \
            "$ND_DEPLOY_HOST" > ~/.ssh/config
      - name: Deploy on the server
        run: ssh -o StrictHostKeyChecking=yes pilot "nd/infra/deploy/deploy.sh $ROLLBACK_FLAG $SHA"
      - name: Wait for health on the new commit
        run: |
          for _ in $(seq 1 60); do
            v="$(curl -fsS --max-time 10 "https://$ND_PUBLIC_HOST/api/v1/health" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' || true)"
            [ "$v" = "$SHA" ] && { echo "healthy on $v"; exit 0; }
            sleep 5
          done
          echo "health did not report $SHA in 5 minutes (last: '$v')"; exit 1
      - name: Smoke test the pilot
        env:
          ND_SMOKE_BASE_URL: https://${{ secrets.ND_PUBLIC_HOST }}
          ND_SMOKE_SHA: ${{ env.SHA }}
        run: bash tools/pilot_smoke.sh
      # infra/backup/check_fresh.sh: the newest .ok marker must be under 26 h old (the nightly job runs
      # at 02:15 UTC). Until the first backup exists the check only warns. It reads the bucket from
      # inside the backup container, so no bucket credentials live in GitHub.
      - name: Backup is fresh
        run: ssh -o StrictHostKeyChecking=yes pilot "nd/infra/deploy/deploy.sh --check-backup"
      - name: E2E purchase flow against the pilot
        env:
          ND_E2E_BASE_URL: https://${{ secrets.ND_PUBLIC_HOST }}
          ND_E2E_USER: ${{ secrets.ND_E2E_USER }}
          ND_E2E_PASSWORD: ${{ secrets.ND_E2E_PASSWORD }}
          ND_E2E_OPERATOR_USER: ${{ secrets.ND_E2E_OPERATOR_USER }}
          ND_E2E_OPERATOR_PASSWORD: ${{ secrets.ND_E2E_OPERATOR_PASSWORD }}
        run: bash web/scripts/e2e-docker.sh
